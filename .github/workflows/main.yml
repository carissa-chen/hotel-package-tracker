name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Tell GitHub Actions which folder contains package.json
    defaults:
      run:
        working-directory: ./backend  # Change 'backend' to your folder name (e.g., server)

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run automated tests
      run: npm test
